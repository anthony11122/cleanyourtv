name: Build launcher APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag or SHA) to build
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secret set; release build will use the debug key."; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Report APK size
        run: |
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "APK not found at $apk"; exit 1; }
          size=$(stat -c %s "$apk")
          echo "APK: $apk"
          echo "APK size: $size bytes ($((size / 1024)) KB)"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
